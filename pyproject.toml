[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "crispy-hummingbird"
description = "Hummingbird UI template pack for django-crispy-forms"
readme = "README.md"
license = "MIT"
maintainers = [ { name = "Ben Atkinson", email = "ben@streamlinedanalytics.co.uk" } ]
authors = [ { name = "David Smith" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dynamic = [
  "version",
]
dependencies = [
  "django>=5.2",
  "django-crispy-forms>=2.3",
]
urls.Changelog = "https://github.com/Streamlined-Analytics/crispy-hummingbird/releases"
urls.CI = "https://github.com/Streamlined-Analytics/crispy-hummingbird/actions"
urls.Homepage = "https://github.com/Streamlined-Analytics/crispy-hummingbird"
urls.Issues = "https://github.com/Streamlined-Analytics/crispy-hummingbird/issues"

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "typecheck" },
]
test = [
  "coverage",
  "pytest",
  "pytest-django",
]
lint = [
  "pre-commit",
  "ruff",
]
typecheck = [
  "django-stubs",
  "mypy",
]

[tool.setuptools]
dynamic.version = { attr = "crispy_hummingbird.__version__" }

[tool.uv]
required-version = ">=0.9.17"
default-groups = [ "dev" ]
exclude-newer = "1 week"

[tool.ruff]
line-length = 88
lint.select = [
  "B",  # flake8-bugbear
  "E",  # pycodestyle errors
  "F",  # Pyflakes
  "I",  # isort
  "UP", # pyupgrade
  "W",  # pycodestyle warnings
]
# Blind pytest.raises(Exception) asserts are an upstream crispy-bootstrap5 test idiom.
lint.per-file-ignores."tests/*" = [ "B017" ]

[tool.mypy]
python_version = "3.10"
warn_unreachable = true
enable_error_code = [
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
]
strict = true
plugins = [ "mypy_django_plugin.main" ]
overrides = [
  # Tests are upstream-derived (crispy-bootstrap5) and use dynamic attributes
  # (form.helper = ...); checking their untyped bodies fights the fork base.
  { module = "tests.*", disallow_any_generics = false, check_untyped_defs = false, allow_untyped_defs = true },
  # django-crispy-forms ships no py.typed; its classes resolve to Any.
  { module = "crispy_forms.*", ignore_missing_imports = true },
  { module = "crispy_hummingbird.*", disallow_subclassing_any = false },
]

[tool.django-stubs]
django_settings_module = "tests.test_settings"

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "." ]
ini_options.django_find_project = false
ini_options.DJANGO_SETTINGS_MODULE = "tests.test_settings"

[tool.coverage]
run.branch = true
run.parallel = true
run.source = [ "crispy_hummingbird", "tests" ]
# Map wheel-installed paths (tox) back to the source tree so combine works.
paths.source = [ "crispy_hummingbird", "*/site-packages/crispy_hummingbird" ]
report.fail_under = 97
report.show_missing = true
report.skip_covered = true
