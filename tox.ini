[tox]
requires =
    tox>=4.2
env_list =
    {py312,py313,py314}-django{52,60,61}-crispy{-release,-latest}
    ; Django 5.2 LTS is the only released line supporting these interpreters.
    {py310,py311}-django52-crispy{-release,-latest}
    lint

[testenv]
package = wheel
wheel_build_env = .pkg
dependency_groups = test
deps =
    django52: django>=5.2,<6
    django60: django>=6,<6.1
    ; Pre-release floor resolves rc now, rolls to 6.1 final automatically.
    django61: django>=6.1b1,<6.2
    ; Weekly advisory env (django-main.yml), deliberately not in env_list.
    djangomain: django @ git+https://github.com/django/django@main
    crispy-release: django-crispy-forms>=2.3
    crispy-latest: https://github.com/django-crispy-forms/django-crispy-forms/archive/main.tar.gz
set_env =
    PYTHONDEVMODE = 1
commands =
    python \
      -W error::ResourceWarning \
      -W error::DeprecationWarning \
      -W error::PendingDeprecationWarning \
      -m pytest {posargs}

[testenv:lint]
skip_install = true
dependency_groups = lint
commands =
    ruff format --check .
    ruff check .
